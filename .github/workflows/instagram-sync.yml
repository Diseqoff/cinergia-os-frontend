   name: Actualizar Instagram

   on:
     schedule:
       - cron: "0 11 * * *"
     workflow_dispatch:

   jobs:
     sincronizar:
       runs-on: ubuntu-latest
       timeout-minutes: 10
       steps:
         - name: Pedir la actualización al servidor
           env:
             API_URL: ${{ secrets.API_URL }}
             CRON_SECRET: ${{ secrets.CRON_SECRET }}
           run: |
             if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
               echo "Faltan los secretos API_URL y CRON_SECRET en el repositorio."
               exit 1
             fi
             curl --silent --show-error --fail-with-body \
               --retry 6 --retry-delay 20 --retry-all-errors \
               --max-time 150 \
               -X POST \
               -H "X-Cron-Secret: $CRON_SECRET" \
               "$API_URL/api/instagram/cron"
